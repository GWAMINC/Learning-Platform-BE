syntax = "proto3";

package user;

option java_package = "com.example.gatewayuser";
option java_outer_classname = "GateWayUserRpcProto";

// Định nghĩa User
message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string role = 5;
  string created_at = 6;
  string updated_at = 7;
}

// Request và Response
message GetUserRequest {
  int32 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetAllUsersRequest {}

message GetAllUsersResponse {
  repeated User users = 1;
}

// Service cho User
service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersResponse);
}
