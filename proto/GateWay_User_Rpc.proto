syntax = "proto3";

package user;

option java_package = "com.example.gatewayuser";
option java_outer_classname = "GateWayUserRpcProto";

// Định nghĩa User
message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string role = 5;
  string created_at = 6;
  string updated_at = 7;
}

// Request và Response
message GetUserRequest {
  int32 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetAllUsersRequest {}

message GetAllUsersResponse {
  repeated User users = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3; // JWT token nếu đăng nhập thành công
  string username = 4;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}
// Service cho User
service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
}
