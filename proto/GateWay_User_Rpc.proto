syntax = "proto3";

package user;

option java_package = "com.example.gatewayuser";
option java_outer_classname = "GateWayUserRpcProto";

// Định nghĩa User
message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string role = 5;
  string created_at = 6;
  string updated_at = 7;
}

message Bio {
  int32 id = 1;
  int32 user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string address = 5;
  string phone = 6;
  string gender = 7; // Use string to represent ENUM values
  string birth_date = 8; // Use string to represent DATE values
  string bio = 9;
  string avatar = 10;
  repeated Course enrolled_courses = 11;
}
message Course {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}
// Request và Response
message GetUserRequest {
  int32 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetAllUsersRequest {}

message GetAllUsersResponse {
  repeated User users = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3; // JWT token nếu đăng nhập thành công
  string username = 4;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}
message updateUserRequest {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string role = 5;
}
message updateUserResponse {
  bool success = 1;
  string message = 2;
}
message getUserBioRequest {
  int32 id = 1;
}
message getUserBioResponse {
  Bio bio = 1;
}
message updateUserBioRequest {
  int32 id = 1;
  string first_name = 2;
  string last_name = 3;
  string address = 4;
  string phone = 5;
  string gender = 6;
  string birth_date = 7;
  string bio = 8;
  bytes avatar = 9;
}
message updateUserBioResponse {
  bool success = 1;
  string message = 2;
  Bio bio = 3;
}
// Service cho User
service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc updateUser (updateUserRequest) returns (updateUserResponse);
  rpc getUserBio (getUserBioRequest) returns (getUserBioResponse);
  rpc updateUserBio (updateUserBioRequest) returns (updateUserBioResponse);
}
