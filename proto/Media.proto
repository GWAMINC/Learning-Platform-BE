syntax = "proto3";

package media;

option java_package = "com.example.media";
option java_outer_classname = "MediaRpcProto";

message Media {
  string id = 1;
  string type = 2;
  string path = 3;
  string file_name = 4;
  string public_id = 5;
  string created_at = 6;
  string updated_at = 7;
}

message UploadMediaRequest {
  bytes data = 1;
  string file_name = 2;
  string type = 3;
}

message UploadMediaResponse {
  string file_name = 1;
  string type = 2;
  string public_id = 3;
  string path = 4;
}

message GetMediaRequest {
  string public_id = 1;
}

message GetMediaResponse {
  Media media = 1;
}

service MediaService {
  rpc UploadMedia (UploadMediaRequest) returns (UploadMediaResponse);
  rpc GetMedia (GetMediaRequest) returns (GetMediaResponse);
}