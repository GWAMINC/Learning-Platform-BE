syntax = "proto3";

package course;

option java_package = "com.example.gatewaycourse";
option java_outer_classname = "GateWayCourseRpcProto";

// Định nghĩa Course
message Course {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request và Response
message GetCourseRequest {
  int32 id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message GetAllCoursesRequest {
  int32 page = 1;
  int32 size = 2;
}

message GetAllCoursesResponse {
  repeated Course courses = 1;
  int32 totalPages = 2;
  int32 totalCourses = 3;
  int32 currentPage = 4;
  int32 pageSize = 5;
}

// Request đăng ký khóa học
message EnrollRequest {
  int32 user_id = 1;
  int32 course_id = 2;
}

// Response khi đăng ký khóa học
message EnrollResponse {
  bool success = 1;
  string message = 2;
}


// Service cho Course
service CourseService {
  rpc GetCourse (GetCourseRequest) returns (GetCourseResponse);
  rpc GetAllCourses (GetAllCoursesRequest) returns (GetAllCoursesResponse);
  // Đăng ký khóa học
  rpc EnrollCourse (EnrollRequest) returns (EnrollResponse);
}
